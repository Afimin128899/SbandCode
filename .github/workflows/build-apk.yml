name: Build SbandCode APK
'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.1.13356709' 'cmake;3.22.1'
      - name: Build native components
        run: |
          export NDK="$ANDROID_HOME/ndk/28.1.13356709"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          export NINJA="$ANDROID_HOME/cmake/3.22.1/bin/ninja"
          mkdir -p engine/linux engine/llama
          sh engine/build-engine.sh
          sh engine/build-loader.sh
          sh engine/build-linux.sh
          sh engine/build-llama.sh
      - name: Build and verify debug APK
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk SbandCode-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify SbandCode-debug.apk
          unzip -p SbandCode-debug.apk lib/arm64-v8a/libopencode.so > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: SbandCode-APK
          path: SbandCode-debug.apk
          if-no-files-found: error
